name: Feature request
description: Suggest an improvement to monitoring, the status UI or deployment templates.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem. A proposed API is welcome, but should not be required.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution or API
      description: Include a configuration or user-flow example when helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds and why they are insufficient.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
