name: CI

on:
  pull_request:
  workflow_call:
  # GITHUB_TOKEN-created version PRs do not trigger pull_request workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run quality

      - name: Audit repository dependencies
        run: bun audit

  node-runtime:
    name: Node runtime (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run --filter @heyo-sh/heyo-status build
      - name: Verify native TCP and TLS checks in Node
        run: node scripts/node-runtime-smoke.mjs

  examples:
    name: Deployment examples
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build all six deployment targets
        run: |
          for project in next-vercel next-cloudflare astro-vercel astro-cloudflare react-router-vercel react-router-cloudflare; do
            bun run --cwd "examples/$project" build
          done
      - name: Bundle Next.js for Cloudflare Workers
        run: cd examples/next-cloudflare && bunx opennextjs-cloudflare build
      - name: Check Cloudflare Worker bundles and D1 bindings
        run: |
          for project in next-cloudflare astro-cloudflare react-router-cloudflare; do
            (cd "examples/$project" && bunx wrangler deploy --dry-run)
          done
      - name: Exercise each framework with Postgres or local D1
        run: bun run example smoke --no-build
      - name: Install Chromium for generated starter HMR smoke
        run: bunx playwright-core install --with-deps chromium
      - name: Build and boot projects from the actual npm tarballs
        env:
          HEYO_STATUS_BROWSER_E2E: "1"
        run: bun run scaffold:smoke
      - name: Boot the bundled Cloudflare Workers (not just the framework dev proxies)
        run: |
          port=4390
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          for project in next-cloudflare astro-cloudflare react-router-cloudflare; do
            echo "Booting $project production Worker on $port"
            # Bun can hoist the binary to the workspace root on a fresh install.
            (cd "examples/$project" && exec "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" dev --local --port "$port" > "$RUNNER_TEMP/$project-worker.log" 2>&1) &
            server=$!
            ready=0
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 3 "http://127.0.0.1:$port/api/heyo-status/status" | grep -q '"monitors"'; then
                ready=1
                break
              fi
              if ! kill -0 "$server" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" -eq 1 ]; then
              if ! curl --fail --silent --max-time 8 "http://127.0.0.1:$port/" -o "$RUNNER_TEMP/$project-page.html" ||
                ! grep -q 'data-slot="status-page"' "$RUNNER_TEMP/$project-page.html"; then
                ready=0
              fi
              if ! curl --fail --silent --max-time 8 "http://127.0.0.1:$port/heyo.svg" -o "$RUNNER_TEMP/$project-logo.svg" ||
                ! grep -q 'viewBox="0 0 2408 2402"' "$RUNNER_TEMP/$project-logo.svg"; then
                ready=0
              fi
            fi
            kill "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
            if [ "$ready" -ne 1 ]; then
              tail -80 "$RUNNER_TEMP/$project-worker.log"
              exit 1
            fi
            port=$((port + 1))
          done
